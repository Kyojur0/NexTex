name: Import v0 Design for Review

on:
  workflow_dispatch:
  repository_dispatch:
    types: [v0_frontend_update]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-v0-frontend
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout v0 design repo
        uses: actions/checkout@v6
        with:
          repository: Kyojur0/v0-nextex-design
          path: v0-src
          fetch-depth: 1

      - name: Import design reference without replacing product code
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/design-upstream

          # Upstream is design input. Product code is maintained and tested here.
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude ".next/" \
            --exclude ".vercel/" \
            --exclude ".env" \
            --exclude ".env.*" \
            "v0-src/" "docs/design-upstream/"

          # Never commit the checked-out source folder into the monorepo.
          rm -rf v0-src

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          commit-message: "docs: import upstream design reference"
          title: "Review upstream NexTex design changes"
          body: |
            Imported `Kyojur0/v0-nextex-design` into `docs/design-upstream/` for review.
            Port desired design changes into the maintained frontend with tests.
            This import does not replace active application code.
          branch: "bot/v0-sync"
          delete-branch: true
